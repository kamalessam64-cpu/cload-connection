<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="engine.css">
<style>

</style></head><body><div id="world"></div>
<script src="engine.js"></script>
<script>
const BT=60/128;const B=n=>+(n*BT).toFixed(3);
window.DURATION=16;
window.EVENTS=[[B(0),'tick'],[B(1),'tick'],[B(2),'tick'],[B(2.5),'roll',BT*1.5],[B(3),'impact'],[B(4),'impact'],[B(5),'whoosh'],[B(6),'riser',BT],
 [B(7),'edmdrop'],[B(13),'hit'],[B(15),'hit'],[B(17),'hit'],[B(18.5),'roll',BT*.5],[B(19),'edmdrop'],[B(24),'riser',BT],[B(25),'edmdrop'],[B(34),'bigboom']];
const w=document.getElementById('world');

const s6=mk(stage,'abs');
const jt1=mk(s6,'c','START YOUR',{top:'230px',fontSize:'210px',color:'var(--ink)'});
const jt2=mk(s6,'c','FITNESS',{top:'420px',fontSize:'250px',color:'var(--gd)'});
const jt3=mk(s6,'c','JOURNEY NOW',{top:'640px',fontSize:'210px',color:'var(--ink)'});
const svgP='<svg width="1080" height="900" viewBox="0 0 1080 900"><path id="jp" d="M80 820 C 300 820, 220 560, 480 560 S 700 300, 960 240" fill="none" stroke="#0b0f0c" stroke-width="26" stroke-linecap="round" stroke-dasharray="1400" stroke-dashoffset="1400"/><circle id="jd" r="46" fill="#a6e62a" stroke="#0b0f0c" stroke-width="16" cx="80" cy="820"/><g id="jm" fill="#0b0f0c"></g></svg>';
const jsv=mk(s6,'abs',svgP,{top:'960px'});
// S7 change + logo
const s7=mk(stage,'abs');
const ch1=mk(s7,'c','CHANGE',{top:'250px',fontSize:'420px',color:'var(--ink)'}),ch2=mk(s7,'c','YOUR LIFE',{top:'580px',fontSize:'330px',color:'var(--gd)'}),ch3=mk(s7,'c','WITH',{top:'870px',fontSize:'220px',color:'var(--ink)'});

const arr=mk(s8,'c','▲',{top:'1700px',fontSize:'110px',color:'var(--gd)',letterSpacing:'0'});

const flash=mk(w,'abs','',{width:W+'px',height:H+'px',background:'#fff',opacity:0});
const cuts=[B(3),B(5),B(7),B(13),B(15),B(17),B(19),B(25)];
window.render=function(t){
 vis(s1,t<B(3));vis(s2,t>=B(3)&&t<B(5));vis(s3,t>=B(5)&&t<B(7));vis(s4,t>=B(7)&&t<B(13));vis(s5,t>=B(13)&&t<B(19));vis(s6,t>=B(19)&&t<B(24));vis(s7,t>=B(24)&&t<B(25)+.0&&false);
 vis(s7,t>=B(24)&&t<B(28));vis(s8,t>=B(28));
 // S1
 if(t<B(3)){const k=Math.min(2,Math.floor(t/BT));const n=3-k;cdN.textContent=n;const p=P(t,k*BT,.18,E.expo);tf(cdN,{s:1.5-.5*p});
   fit(cdN,700);cdRing.style.borderColor='var(--ink)';tf(cdRing,{s:.6+.4*p,o:1})}
 // S2
 tf(b1,{x:(1-P(t,B(3),.2,E.expo))*-1100});tf(b2,{x:t<B(4)?1500:(1-P(t,B(4),.2,E.expo))*1100,o:t>=B(4)?1:0});
 tf(bbar,{s:1});bbar.style.width=1080*P(t,B(4),.3)+'px';
 // S3
 const ip=P(t,B(5),.45,E.out);tf(iris,{s:.05+ip*1.0,o:1});iris.style.transformOrigin='50% 50%';iris.style.left='-260px';
 lg.style.left='220px';lg.style.top='650px';tf(lg,{s:P(t,B(5)+.15,.4,E.back),o:t>=B(5)+.15?1:0});
 // S4
 const q=P(t,B(7),.5,E.back);const swing=Math.sin((t-B(7))*5.5)*14*Math.exp(-(t-B(7))*.9);
 tagWrap.style.transform=`translateY(${-1000*(1-q)}px) rotate(${swing}deg)`;
 conf.forEach((c,i)=>{const p=P(t,B(7)+.25,1.2,E.out);const a=rnd(i+3)*Math.PI*2,r=200+rnd(i+9)*700;tf(c,{x:Math.cos(a)*r*p,y:Math.sin(a)*r*p+(p*p)*300,r:p*(300+rnd(i)*500),o:t>=B(7)+.25?1-p*.6:0})});
 // S5
 const inI=(a,b)=>t>=B(a)&&t<B(b);
 vis(ic1,inI(13,15));vis(w1,inI(13,15));vis(ic2,inI(15,17));vis(w2,inI(15,17));vis(ic3,inI(17,19));vis(w3,inI(17,19));
 [[ic1,w1,13],[ic2,w2,15],[ic3,w3,17]].forEach(([ic,wd,k])=>{const p=P(t,B(k),.22,E.back);tf(ic,{s:p,r:(1-p)*-30});tf(wd,{x:(1-P(t,B(k)+.05,.2,E.expo))*900})});
 // S6
 [jt1,jt2,jt3].forEach((e,i)=>{tf(e,{x:(i%2?1:-1)*(1-P(t,B(19)+i*.2,.25,E.expo))*1100})});
 const jp=document.getElementById('jp'),jd=document.getElementById('jd');if(jp){const L=jp.getTotalLength();const pr=P(t,B(20),BT*3.6,E.inOut);jp.setAttribute('stroke-dasharray',L);jp.setAttribute('stroke-dashoffset',L*(1-pr));const pt=jp.getPointAtLength(L*pr);jd.setAttribute('cx',pt.x);jd.setAttribute('cy',pt.y);jd.setAttribute('r',46+8*pulse(t,B(23.5),.3))}
 // S7
 tf(ch1,{s:t<B(24)?0:1+.4*(1-P(t,B(24),.15,E.expo))});tf(ch2,{s:t<B(25)?0:1+.4*(1-P(t,B(25),.15,E.expo))});tf(ch3,{s:t<B(26)?0:1+.4*(1-P(t,B(26),.15,E.expo))});
 const l7=P(t,B(26)+.1,.4,E.back);tf(ring7,{s:l7});lg7.style.left='330px';lg7.style.top='1240px';tf(lg7,{s:l7});
 // S8
 lgC.style.left='425px';lgC.style.top='36px';tf(lgC,{s:P(t,B(28),.3,E.back)});centerX(cBf);tf(cBf,{s:P(t,B(28)+.1,.3,E.back),r:-3});
 tf(bub1,{s:P(t,B(29),.25,E.back),o:t>=B(29)?1:0});tf(bub2,{s:P(t,B(30.5),.25,E.back),o:t>=B(30.5)?1:0});
 const ty=t>=B(29.8)&&t<B(30.5);vis(typing,ty||t>=B(32));typing.style.opacity=ty?1:0;
 [...typing.children].forEach((c,i)=>{c.style.opacity=.3+.7*Math.max(0,Math.sin(t*10-i*1.2))});
 tf(btn,{s:P(t,B(31.5),.3,E.back)*(1+.04*Math.sin((t-B(31.5))*12)),o:t>=B(31.5)?1:0});tf(arr,{o:t>=B(32.5)?1:0,y:-Math.abs(Math.sin((t-B(32.5))*7))*40});
 // stripes drift
 stripes.forEach((s,i)=>s.style.transform=`rotate(-14deg) translateX(${((t*(200+i*40))%300)*(i%2?1:-1)}px)`);
 // swoosh + flash + shake
 let sx=-2400;for(const c of cuts){if(t>=c&&t<c+.28)sx=-1700+3400*E.inOut((t-c)/.28)}
 sw.style.transform=`translateX(${sx}px) rotate(18deg)`;sw.style.display=sx>-2300?'':'none';
 let fo=0;for(const c of [B(3),B(4),B(7),B(19),B(25)])fo=Math.max(fo,.7*pulse(t,c,.06));flash.style.opacity=fo;
 const a1=shake(t,B(7),.35,26),a2=shake(t,B(19),.3,20),a3=shake(t,B(3),.2,14);stage.style.transform=`translate(${a1[0]+a2[0]+a3[0]}px,${a1[1]+a2[1]+a3[1]}px)`;
 w.style.opacity=t>15.7?1-P(t,15.7,.3,E.lin):1;
};
ready().then(()=>{[b1,b2,jt1,jt2,jt3,ch1,ch2,ch3,w1,w2,w3].forEach(e=>fit(e,980));fit(tBf,640);fit(t30,640);fit(tOff,640);centerX(cBf);window.render(0)});
