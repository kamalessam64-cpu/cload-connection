<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="lcd-common.css">
<style>
.stripes{position:absolute;right:-120px;top:0;width:900px;height:1080px;background:repeating-linear-gradient(115deg,rgba(166,230,42,.20) 0 34px,transparent 34px 80px)}
.slab{position:absolute;left:80px;top:66px;width:948px;height:948px;background:var(--g);transform:translate(30px,30px);clip-path:polygon(9% 0,100% 0,91% 100%,0 100%)}
.photo{position:absolute;left:80px;top:66px;width:948px;height:948px;clip-path:polygon(9% 0,100% 0,91% 100%,0 100%);background:#dfeadc;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:none}
.logo{left:1140px;top:46px}
.ev{position:absolute;right:70px;top:84px;text-align:right}
.ev .t{display:inline-block;background:var(--ink);color:#fff;font-weight:900;font-style:italic;font-size:62px;letter-spacing:-1px;padding:8px 28px 8px 32px;transform:skewX(-8deg)}
.ev .s{font-weight:700;font-size:16px;letter-spacing:3.5px;margin-top:12px;color:#444}
.pill{position:absolute;left:1140px;top:450px;background:linear-gradient(90deg,#f1d98a,#b8861f);color:var(--ink);font-weight:900;font-size:38px;letter-spacing:11px;padding:10px 30px 10px 34px;transform:skewX(-8deg)}
.plate{position:absolute;left:1090px;top:540px;width:830px;height:360px;background:var(--ink);clip-path:polygon(7% 0,100% 0,100% 100%,0 100%)}
.plate::before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:var(--g)}
.n{position:absolute;left:1160px;width:700px;font-weight:900;font-style:italic;letter-spacing:-4px;text-transform:uppercase;line-height:1;transform:skewX(-8deg);white-space:nowrap}
#n1{top:585px;color:#fff}#n2{top:725px;color:var(--g)}
.foot{position:absolute;left:1140px;right:70px;bottom:48px;display:flex;justify-content:space-between;font-weight:800;font-size:18px;letter-spacing:5px;color:#444}
.foot b{color:var(--gd)}
</style></head><body>
<div class="stripes"></div>
<div class="slab"></div>
<div class="photo"><div class="ph" id="ph">ATHLETE<br>PHOTO</div><img id="photo" alt=""></div>
<div class="logo"><img src="assets/x7plus-logo.jpg" alt=""></div>
<div class="ev"><span class="t" id="comp">COMBAT GAMES</span><div class="s">EGYPT'S ULTIMATE FITNESS TEST</div></div>
<div class="pill">ELITE ATHLETE</div>
<div class="plate"></div>
<div class="n" id="n1"></div><div class="n" id="n2"></div>
<div class="foot"><span><b>X7PLUS</b> × COMBAT GAMES</span><span>#COMBATGAMES</span></div>
<script src="lcd-common.js"></script>
<script>
const p=new URLSearchParams(location.search);
const [a,b]=twoLines((p.get('name')||'ATHLETE NAME'));
for(const [id,t] of [['n1',a],['n2',b]]){const e=document.getElementById(id);e.innerHTML='<span>'+t+'</span>';fit(e,700,126)}
setPhoto(p,'photo','ph');
</script></body></html>
